services:
  - type: web
    name: rag-chatbot-api
    runtime: docker
    plan: standard
    region: oregon
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    autoDeploy: false
    disk:
      name: rag-chatbot-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: CHROMA_PERSIST_DIR
        value: /var/data/chroma_db
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: MAX_UPLOAD_SIZE_MB
        value: "10"
      - key: RAG_TOP_K
        value: "4"
      - key: RAG_DISTANCE_THRESHOLD
        value: "1.2"
